<svg width="100%" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">More projects in my repositories</title>
  <desc id="desc">Dark red editorial footer banner for the xtofuub GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.5" stop-color="#0c0708"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#8c0b16" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="16" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.045"/></feComponentTransfer>
    </filter>
    <clipPath id="rounded"><rect x="1" y="1" width="1198" height="148" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="150" fill="url(#bg)"/>
    <rect width="1200" height="150" fill="url(#glow)"/>
    <path d="M-30 103 C246 125 416 32 611 52 C826 75 969 139 1230 92" fill="none" stroke="#cf1d2e" stroke-width="1.2" opacity="0.24"/>
    <line x1="0" y1="2" x2="1200" y2="2" stroke="#d82737" stroke-width="2" opacity="0.66"/>
    <line x1="54" y1="112" x2="1146" y2="112" stroke="#351014" stroke-width="1"/>
    <line x1="44" y1="33" x2="78" y2="33" stroke="#ef3345" stroke-width="2.5"/>
    <line x1="1122" y1="120" x2="1156" y2="120" stroke="#ef3345" stroke-width="2.5"/>

    <text x="600" y="61" text-anchor="middle" fill="#f1e9e4" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic">There are more projects in my repositories.</text>
    <text x="600" y="89" text-anchor="middle" fill="#b89498" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3">RESEARCH  •  TOOLING  •  EXPERIMENTS  •  BUILDS</text>
    <text x="62" y="136" fill="#ef3345" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.5">/ MORE WORK</text>
    <text x="1138" y="136" text-anchor="end" fill="#ef3345" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.5">XTOFUUB /</text>
    <circle cx="600" cy="22" r="2.5" fill="#ef3345" opacity="0.8"/>
    <circle cx="544" cy="42" r="1.2" fill="#ef3345" opacity="0.4"/>
    <circle cx="674" cy="37" r="1.5" fill="#ef3345" opacity="0.38"/>
    <rect width="1200" height="150" filter="url(#grain)" opacity="0.74"/>
  </g>
  <rect x="1" y="1" width="1198" height="148" rx="18" fill="none" stroke="#382d2f" stroke-width="2"/>
</svg>
