    <text x="0" y="47" fill="#a9a9ae" font-size="12">› python</text>
    <text x="0" y="74" fill="#a9a9ae" font-size="12">› javascript / typescript</text>
    <text x="0" y="101" fill="#a9a9ae" font-size="12">› react / next.js</text>
