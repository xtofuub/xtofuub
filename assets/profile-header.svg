  <text x="1094" y="72" font-size="16" letter-spacing="4">•••</text>
</g>
<text x="42" y="160" fill="#f2f2f0" class="sans" font-size="70" font-weight="800" letter-spacing="5">ABOUT ME</text>
<text x="44" y="203" fill="#bdbdc1" class="mono" font-size="14">I like taking systems apart to understand how they work.</text>
<text x="44" y="228" fill="#bdbdc1" class="mono" font-size="14">Then I turn what I learn into useful software.</text>

<g transform="translate(900 116)" class="mono">
