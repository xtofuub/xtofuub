<circle cx="340" cy="46" r="4" fill="#111"/><text x="360" y="51" fill="#222" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="2">ABOUT ME</text><path d="M340 72H1148" stroke="#989894"/>
<text x="340" y="150" fill="#101010" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="800" letter-spacing="2">I LIKE TAKING THINGS APART</text>
<text x="340" y="211" fill="#101010" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="800" letter-spacing="2">TO UNDERSTAND HOW THEY WORK.</text>
<text x="340" y="260" fill="#343432" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">Mostly interested in reverse engineering, security,</text>
<text x="340" y="284" fill="#343432" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">software development and building useful tools.</text>
<text x="340" y="312" fill="#111" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">Always learning. Always building.</text>
