<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">About profile</title>
<desc id="desc">Dark monochrome editorial profile header focused on reverse engineering, security, software and tooling.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070708"/>
    <stop offset="0.58" stop-color="#0a0a0b"/>
    <stop offset="1" stop-color="#111113"/>
  </linearGradient>
  <linearGradient id="structure" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#28282b"/>
    <stop offset="0.55" stop-color="#151517"/>
    <stop offset="1" stop-color="#09090a"/>
  </linearGradient>
  <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="17"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer>
  </filter>
</defs>
<style>
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  .sans { font-family: Arial, Helvetica, sans-serif; }
</style>
<rect width="1200" height="520" rx="10" fill="url(#bg)"/>
<rect width="1200" height="520" rx="10" filter="url(#grain)" opacity=".35"/>

<!-- minimal architectural backdrop -->
<path d="M760 520L890 124L995 38L1200 211V520Z" fill="url(#structure)" opacity=".86"/>
