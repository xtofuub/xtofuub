  <text x="18" y="68" fill="#a4a4a9" font-size="12">curious by default.</text>
  <text x="18" y="90" fill="#a4a4a9" font-size="12">builder by choice.</text>
  <text x="18" y="112" fill="#a4a4a9" font-size="12">always learning.</text>
</g>

