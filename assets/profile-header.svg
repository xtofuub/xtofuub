<text x="340" y="250" fill="#232323" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">I like taking systems apart to understand how they work.</text><text x="340" y="276" fill="#232323" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">Then I turn what I learn into useful software.</text><text x="340" y="305" fill="#111" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">Always learning. Always building.</text>
