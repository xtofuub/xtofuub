<svg width="100%" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">More projects footer</title>
  <desc id="desc">Dark red footer banner for the xtofuub GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0b0708"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="17" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.04"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="150" rx="18" fill="url(#bg)"/>
  <path d="M-30 104 C232 126 418 30 608 53 C809 76 965 138 1230 94" fill="none" stroke="#ef3345" stroke-width="1.2" opacity="0.22"/>
  <line x1="0" y1="2" x2="1200" y2="2" stroke="#ef3345" stroke-width="2" opacity="0.62"/>
  <line x1="54" y1="112" x2="1146" y2="112" stroke="#341014" stroke-width="1"/>
  <text x="600" y="61" text-anchor="middle" fill="#f2ece7" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic">There are more projects across my repositories.</text>
  <text x="600" y="89" text-anchor="middle" fill="#b89498" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3">RESEARCH  •  TOOLING  •  EXPERIMENTS  •  BUILDS</text>
  <text x="62" y="136" fill="#ef3345" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.5">/ MORE WORK</text>
  <text x="1138" y="136" text-anchor="end" fill="#ef3345" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.5">XTOFUUB /</text>
  <circle cx="600" cy="22" r="2.5" fill="#ef3345" opacity="0.8"/>
  <circle cx="544" cy="42" r="1.2" fill="#ef3345" opacity="0.4"/>
  <circle cx="674" cy="37" r="1.5" fill="#ef3345" opacity="0.38"/>
  <rect width="1200" height="150" rx="18" filter="url(#grain)" opacity="0.72"/>
  <rect x="1" y="1" width="1198" height="148" rx="18" fill="none" stroke="#382d2f" stroke-width="2"/>
</svg>