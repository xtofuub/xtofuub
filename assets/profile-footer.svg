<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="title desc">
<title id="title">More repositories</title>
<desc id="desc">Dark monochrome banner linking to more repositories.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#080809"/>
    <stop offset="0.62" stop-color="#0b0b0d"/>
    <stop offset="1" stop-color="#131316"/>
  </linearGradient>
  <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="23"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .055"/></feComponentTransfer>
  </filter>
</defs>
<rect width="1200" height="170" rx="8" fill="url(#bg)"/>
<rect width="1200" height="170" rx="8" filter="url(#grain)" opacity=".3"/>
<rect x="1" y="1" width="1198" height="168" rx="7" fill="none" stroke="#303034"/>

<!-- quiet architectural texture -->
<path d="M820 170L933 62L1010 29L1200 99V170Z" fill="#161619"/>
<path d="M933 62L1010 29L1200 99L1180 110L1010 52L950 76Z" fill="#2a2a2e" opacity=".72"/>
<g stroke="#3b3b40" opacity=".34"><path d="M950 77V170"/><path d="M990 58V170"/><path d="M1030 59V170"/><path d="M1070 74V170"/><path d="M1110 88V170"/><path d="M1150 102V170"/><path d="M867 128H1200"/></g>

<circle cx="66" cy="85" r="29" fill="none" stroke="#d7d7da"/>
<path d="M53 85H79M66 72V98" stroke="#d7d7da"/>
<text x="118" y="76" fill="#f1f1ef" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" letter-spacing="1.8">MORE REPOSITORIES</text>
<text x="118" y="103" fill="#8f8f95" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">browse projects, tools, experiments and archived work</text>
<path d="M690 85H780" stroke="#d7d7da"/>
