name: update profile stats

# Static original PNG banners are independent from the live stats generator.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/generate-profile-stats.mjs'
      - '.github/workflows/profile-stats.yml'

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate live SVG
        run: node scripts/generate-profile-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changed stats
        shell: bash
        run: |
          if git diff --quiet -- assets/profile-stats.svg; then
            echo "No stats change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-stats.svg
          git commit -m "chore: update profile stats"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
