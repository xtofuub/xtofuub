name: update profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/generate-profile-stats.mjs'
      - 'scripts/refine-profile-layout.mjs'
      - '.github/workflows/profile-stats.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate live SVG
        run: |
          node scripts/generate-profile-stats.mjs
          node scripts/refine-profile-layout.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changed stats
        shell: bash
        run: |
          if git diff --quiet -- assets/profile-stats.svg; then
            echo "No stats change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-stats.svg
          git commit -m "chore: update profile stats"
          git push
