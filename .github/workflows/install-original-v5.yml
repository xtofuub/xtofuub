name: install original profile banners v5

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/install-original-v5.yml'

permissions:
  contents: write

concurrency:
  group: install-original-profile-banners-v5
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify clean banner sources
        shell: bash
        run: |
          set -euo pipefail
          cat assets/banner-source-v5/header.*.b64 | base64 --decode > /tmp/header.webp
          cat assets/banner-source-v5/footer.*.b64 | base64 --decode > /tmp/footer.webp
          echo '801c3b5821a71487abe415433e18750f08c41d8d77b78733f655ee3d4394bc17  /tmp/header.webp' | sha256sum -c -
          echo 'fbc0e7b4ddb81c525acfc5ea63d2da7b8e55ef83c25e70ee4fc459809d043f30  /tmp/footer.webp' | sha256sum -c -
          test "$(stat -c%s /tmp/header.webp)" = "41324"
          test "$(stat -c%s /tmp/footer.webp)" = "38234"

      - name: Convert originals to PNG without resizing
        shell: bash
        run: |
          set -euo pipefail
          if command -v magick >/dev/null 2>&1; then
            magick /tmp/header.webp -strip assets/profile-header-original.png
            magick /tmp/footer.webp -strip assets/profile-footer-original.png
            H_DIM="$(magick identify -format '%wx%h' assets/profile-header-original.png)"
            F_DIM="$(magick identify -format '%wx%h' assets/profile-footer-original.png)"
          else
            if ! command -v convert >/dev/null 2>&1 || ! command -v identify >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y imagemagick
            fi
            convert /tmp/header.webp -strip assets/profile-header-original.png
            convert /tmp/footer.webp -strip assets/profile-footer-original.png
            H_DIM="$(identify -format '%wx%h' assets/profile-header-original.png)"
            F_DIM="$(identify -format '%wx%h' assets/profile-footer-original.png)"
          fi
          echo "header: ${H_DIM} $(stat -c%s assets/profile-header-original.png) bytes"
          echo "footer: ${F_DIM} $(stat -c%s assets/profile-footer-original.png) bytes"
          test "$H_DIM" = "900x386"
          test "$F_DIM" = "900x300"
          test "$(stat -c%s assets/profile-header-original.png)" -gt 50000
          test "$(stat -c%s assets/profile-footer-original.png)" -gt 50000

      - name: Widen contribution grid
        shell: bash
        run: |
          set -euo pipefail
          FILE='scripts/generate-profile-stats.mjs'
          grep -q 'const cell = 10;' "$FILE"
          grep -q 'const gap = 4;' "$FILE"
          grep -q 'const originY = 362;' "$FILE"
          grep -q 'x="860" y="486">LESS' "$FILE"
          sed -i 's/const cell = 10;/const cell = 15;/' "$FILE"
          sed -i 's/const gap = 4;/const gap = 5;/' "$FILE"
          sed -i 's/const originY = 362;/const originY = 346;/' "$FILE"
          sed -i 's/x="54" y="377">MON/x="54" y="382">MON/' "$FILE"
          sed -i 's/x="54" y="405">WED/x="54" y="422">WED/' "$FILE"
          sed -i 's/x="54" y="433">FRI/x="54" y="462">FRI/' "$FILE"
          sed -i 's/x="860" y="486">LESS/x="928" y="514">LESS/' "$FILE"
          sed -i 's/x="900" y="478" width="10" height="10" rx="1"/x="968" y="504" width="12" height="12" rx="1.5"/' "$FILE"
          sed -i 's/x="916" y="478" width="10" height="10" rx="1"/x="986" y="504" width="12" height="12" rx="1.5"/' "$FILE"
          sed -i 's/x="932" y="478" width="10" height="10" rx="1"/x="1004" y="504" width="12" height="12" rx="1.5"/' "$FILE"
          sed -i 's/x="948" y="478" width="10" height="10" rx="1"/x="1022" y="504" width="12" height="12" rx="1.5"/' "$FILE"
          sed -i 's/x="964" y="478" width="10" height="10" rx="1"/x="1040" y="504" width="12" height="12" rx="1.5"/' "$FILE"
          sed -i 's/x="982" y="486">MORE/x="1060" y="514">MORE/' "$FILE"
          grep -q 'const cell = 15;' "$FILE"
          grep -q 'const gap = 5;' "$FILE"
          grep -q 'const originY = 346;' "$FILE"
          grep -q 'x="928" y="514">LESS' "$FILE"

      - name: Point README at fresh original PNGs
        shell: bash
        run: |
          printf '%s\n' \
            '<p align="center">' \
            '  <img src="./assets/profile-header-original.png" width="100%" alt="About — building useful tools across software, systems, and security" />' \
            '</p>' \
            '' \
            '<p align="center">' \
            '  <img src="./assets/profile-stats.svg" width="100%" alt="Live GitHub activity — repositories, contributions, commits, pull requests, stars, streak and languages" />' \
            '</p>' \
            '' \
            '<p align="center">' \
            '  <a href="https://github.com/xtofuub?tab=repositories">' \
            '    <img src="./assets/profile-footer-original.png" width="100%" alt="More repositories — browse projects, experiments, and archived work" />' \
            '  </a>' \
            '</p>' > README.md

      - name: Remove broken attempts and temporary installers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/banner-source-v5 assets/banner-fix-src assets/banner-v2-src assets/banner-v3-src assets/banner-v4-src assets/final-banner-src assets/original-banner-src
          rm -f assets/profile-header.png assets/profile-footer.png assets/profile-header-v2.png assets/profile-footer-v2.png assets/profile-header-v4.png assets/profile-footer-v4.png
          rm -f .github/workflows/finalize-profile-banners.yml .github/workflows/install-final-profile-banners.yml .github/workflows/install-selected-banners.yml .github/workflows/install-v4-banners.yml .github/workflows/install-original-v5.yml

      - name: Commit restored banners and stats layout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore original profile banners and widen contributions"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
