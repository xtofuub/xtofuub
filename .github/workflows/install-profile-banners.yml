name: install profile banners

on:
  push:
    branches: [main]
    paths:
      - 'assets/profile-header.png.b64'
      - 'assets/profile-footer.png.b64'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-profile-banners
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode PNG banners
        run: |
          base64 --decode assets/profile-header.png.b64 > assets/profile-header.png
          base64 --decode assets/profile-footer.png.b64 > assets/profile-footer.png
          file assets/profile-header.png assets/profile-footer.png
      - name: Commit PNG banners
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-header.png assets/profile-footer.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "design: install PNG profile banners"
          git pull --rebase origin main
          git push origin HEAD:main
