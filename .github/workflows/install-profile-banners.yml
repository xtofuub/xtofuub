name: install profile banners

on:
  push:
    branches: [main]
    paths:
      - 'assets/banner-src/**'
      - '.github/workflows/install-profile-banners.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-profile-banners
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild banner source images
        run: |
          cat assets/banner-src/header.*.b64 | base64 --decode > /tmp/profile-header.jpg
          cat assets/banner-src/footer.*.b64 | base64 --decode > /tmp/profile-footer.jpg
          test "$(stat -c%s /tmp/profile-header.jpg)" -gt 20000
          test "$(stat -c%s /tmp/profile-footer.jpg)" -gt 15000
          file /tmp/profile-header.jpg /tmp/profile-footer.jpg

      - name: Convert banners to PNG
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image

          for src, dst in [
              ('/tmp/profile-header.jpg', 'assets/profile-header.png'),
              ('/tmp/profile-footer.jpg', 'assets/profile-footer.png'),
          ]:
              image = Image.open(src).convert('RGB')
              if image.size != (900, 386):
                  raise SystemExit(f'unexpected banner size for {src}: {image.size}')
              image.save(dst, optimize=True)
          PY
          file assets/profile-header.png assets/profile-footer.png

      - name: Commit PNG banners
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-header.png assets/profile-footer.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "design: install PNG profile banners"
          git pull --rebase origin main
          git push origin HEAD:main
