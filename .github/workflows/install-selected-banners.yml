name: install selected profile banners

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/install-selected-banners.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-selected-profile-banners
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify PNG banners
        shell: bash
        run: |
          set -euo pipefail
          cat assets/banner-fix-src/header.*.b64 | tr -d '\n\r ' | base64 --decode > assets/profile-header.png
          cat assets/banner-fix-src/footer.*.b64 | tr -d '\n\r ' | base64 --decode > assets/profile-footer.png

          test "$(stat -c%s assets/profile-header.png)" -eq 24536
          test "$(stat -c%s assets/profile-footer.png)" -eq 21283
          test "$(head -c 8 assets/profile-header.png | xxd -p)" = "89504e470d0a1a0a"
          test "$(head -c 8 assets/profile-footer.png | xxd -p)" = "89504e470d0a1a0a"
          echo "4ae52d549f987ecc07824d937919f5e8a189f26e177781fd6011f581ed08db52  assets/profile-header.png" | sha256sum -c -
          echo "4de3acee14dc577f2a8eb3f723c719e8334a010e330b71dd1a8973965b8c6968  assets/profile-footer.png" | sha256sum -c -
          file assets/profile-header.png assets/profile-footer.png

      - name: Commit verified banners
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/profile-header.png assets/profile-footer.png; then
            echo "Banner files already match."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-header.png assets/profile-footer.png
          git commit -m "assets: install selected PNG profile banners"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
